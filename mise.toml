# Yggdrasil development environment and common tasks.
# Install the .NET 10 SDK: mise install
# List tasks: mise tasks ls
# Run a task: mise run <task>
# Build tasks expect a project or solution in the repository root.

[tools]
dotnet = "10"

[tasks.setup]
description = "Restore NuGet dependencies"
alias = "restore"
run = "dotnet restore"

[tasks.build]
description = "Build the solution"
alias = "b"
run = "dotnet build"

[tasks.test]
description = "Build and run the test suite"
alias = "t"
run = "dotnet test"

[tasks.lint]
description = "Verify .NET formatting and code style"
run = "dotnet format --verify-no-changes"

[tasks."lint:fix"]
description = "Apply .NET formatting and code style fixes"
alias = "format"
run = "dotnet format"

[tasks.clean]
description = "Clean .NET build outputs"
run = "dotnet clean"

[tasks.publish]
description = "Publish in Release configuration"
run = "dotnet publish --configuration Release"

[tasks.check]
description = "Build, verify formatting, and run tests"
run = [
  "dotnet restore",
  "dotnet build --no-restore",
  "dotnet format --verify-no-changes --no-restore",
  "dotnet test --no-build --no-restore",
]

[tasks.ci]
description = "Restore, build, verify formatting, and test in Release configuration"
run = [
  "dotnet restore",
  "dotnet build --configuration Release --no-restore",
  "dotnet format --verify-no-changes --no-restore",
  "dotnet test --configuration Release --no-build --no-restore",
]
